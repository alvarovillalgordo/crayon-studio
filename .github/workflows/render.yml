name: render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'ID de la composicion'
        type: choice
        required: true
        default: 'Demo'
        options:
          - Demo
          - Lehman
      output:
        description: 'Nombre del archivo'
        required: true
        default: 'demo.mp4'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobaciones (QA y tipos)
        run: |
          npm run typecheck
          npm run validate

      - name: Validar parámetros de render
        env:
          INPUT_COMPOSITION: ${{ inputs.composition || 'Demo' }}
          INPUT_OUTPUT: ${{ inputs.output || 'demo.mp4' }}
        run: |
          case "$INPUT_COMPOSITION" in
            Demo|Lehman) ;;
            *) echo "::error::Composicion no permitida."; exit 1 ;;
          esac
          if [[ ! "$INPUT_OUTPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.mp4$ ]]; then
            echo "::error::El nombre de salida debe ser un nombre .mp4 simple, sin rutas."
            exit 1
          fi

      - name: Cache browser y bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.remotion
            node_modules/.cache
          key: remotion-${{ runner.os }}-4.0.543

      - run: npx remotion browser ensure

      - name: Render
        env:
          INPUT_COMPOSITION: ${{ inputs.composition || 'Demo' }}
          INPUT_OUTPUT: ${{ inputs.output || 'demo.mp4' }}
        run: npx remotion render src/index.ts "$INPUT_COMPOSITION" "out/$INPUT_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 14
