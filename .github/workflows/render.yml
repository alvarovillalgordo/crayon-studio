name: render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'ID de la composicion'
        type: choice
        required: true
        default: 'Demo'
        options:
          - Demo
          - Lehman
      output:
        description: 'Nombre del archivo'
        required: true
        default: 'demo.mp4'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobaciones (QA y tipos)
        run: |
          npm run typecheck
          npm run validate

      - name: Validar parámetros de render
        env:
          INPUT_COMPOSITION: ${{ inputs.composition || 'Demo' }}
          INPUT_OUTPUT: ${{ inputs.output || 'demo.mp4' }}
        run: |
          case "$INPUT_COMPOSITION" in
            Demo|Lehman) ;;
            *) echo "::error::Composicion no permitida."; exit 1 ;;
          esac
          if [[ ! "$INPUT_OUTPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.mp4$ ]]; then
            echo "::error::El nombre de salida debe ser un nombre .mp4 simple, sin rutas."
            exit 1
          fi

      - name: Cache browser y bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.remotion
            node_modules/.cache
          key: remotion-${{ runner.os }}-4.0.543

      - run: npx remotion browser ensure

      - name: Render
        env:
          INPUT_COMPOSITION: ${{ inputs.composition || 'Demo' }}
          INPUT_OUTPUT: ${{ inputs.output || 'demo.mp4' }}
        run: npx remotion render src/index.ts "$INPUT_COMPOSITION" "out/$INPUT_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 14
